[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-beacon"
version = "0.1.0"
description = "Software-only Codex status phone companion"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.23,<5",
  "PySide6>=6.10,<7",
  "websocket-client>=1.8,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[project.gui-scripts]
codex-beacon = "codex_beacon.companion.app:main"

[project.scripts]
codex-beacon-setup = "codex_beacon.agent_setup:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"codex_beacon.packs.focus" = ["manifest.json"]
"codex_beacon.packs.agent" = ["manifest.json"]
"codex_beacon.companion" = [
  "web/*.html",
  "web/*.css",
  "web/*.js",
  "web/*.webmanifest",
  "web/*.svg",
]
