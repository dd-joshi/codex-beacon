[platformio]
default_envs = esp32-c3-supermini

[env]
test_framework = unity

[env:esp32-c3-supermini]
platform = platformio/espressif32@6.13.0
board = esp32-c3-devkitm-1
framework = espidf
monitor_speed = 115200
upload_speed = 460800
upload_port = COM12
monitor_port = COM12
board_build.flash_size = 4MB
board_build.partitions = partitions.csv
build_flags =
  -std=gnu++17
build_unflags = -std=gnu++11 -std=gnu++14


[env:native]
platform = native
platform_packages = platformio/toolchain-gccmingw32@1.50100.0
test_build_src = yes
build_src_filter =
  +<model.cpp>
  +<renderer_core.cpp>
  +<strict_json.cpp>
build_flags = -std=gnu++17 -static -static-libgcc -static-libstdc++
extra_scripts = pre:tools/native_toolchain.py
